name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          xcodebuild test \
            -project 'Hidden Bar.xcodeproj' \
            -scheme 'Hidden Bar' \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
